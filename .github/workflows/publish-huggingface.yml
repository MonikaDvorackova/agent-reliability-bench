name: Publish Hugging Face dataset and Space
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: huggingface-publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'huggingface_hub>=0.30,<2'
      - run: python -m scripts.export_benchmark
      - name: Publish dataset
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: ${{ vars.HF_DATASET_REPO }}
        run: python -m scripts.publish_hf
      - name: Publish free Static Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_REPO: ${{ vars.HF_SPACE_REPO }}
        run: |
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          token = os.environ["HF_TOKEN"]
          repo = os.environ["HF_SPACE_REPO"]
          if "/" not in repo:
              raise ValueError("HF_SPACE_REPO must be namespace/name")
          api = HfApi(token=token)
          from huggingface_hub.errors import HfHubHTTPError
          try:
              api.create_repo(repo_id=repo, repo_type="space", space_sdk="static", exist_ok=True)
          except HfHubHTTPError as exc:
              if exc.response is not None and exc.response.status_code == 402:
                  print("Hugging Face rejected Static Space creation with HTTP 402.")
                  print("Dataset published; demo can be deployed via GitHub Pages instead.")
                  raise SystemExit(0)
              raise
          api.upload_folder(folder_path="static-space", repo_id=repo, repo_type="space", commit_message="Publish interactive evaluator")
          print(f"https://huggingface.co/spaces/{repo}")
          PY
